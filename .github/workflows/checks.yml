# Runs the project's checks on every push to main and on every pull request.
#
# Each job runs the same command a contributor runs by hand (see CONTRIBUTING.md), so a failure here can be reproduced locally.
# Passing on GitHub's runners as of commit 8cbd8ea (13 Oct 2026). Two runs before that failed because one table is written with full
# double precision and the runner's CPU rounded its last bits differently; regression_check.py now ignores that. If a job fails later
# for a reason that looks like the workflow rather than the code (an action version, a runner image), fix the workflow.
name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  android-recorder-and-lap-timer:
    # 324 checks against fakes of the Android classes (315 without the real log); needs only a JDK. The real Sepang log is replayed through
    # the lap timer and the stage code.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: App tests
        run: JAVA_EXTRA=-Dreal.log=data/sepang-2026-10-13/session_20261013_095638.csv bash android/tests/run.sh all

  analysis:
    # The recording meets the log format, and the analysis still gives the committed results on the committed log.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Log format check on the committed session
        run: python analysis/check_log.py data/sepang-2026-10-13/session_20261013_095638.csv
      - name: Regression check
        run: python analysis/regression_check.py
      - name: The reader takes every kind of row the app writes
        run: python analysis/test_reader.py

  stages-second-implementation:
    # The stage method written a second time from docs/stage-algorithm.md alone (analysis/stage_compare.py) must reproduce every expected
    # result in analysis/stage_fixtures, and the stage simulation must still run. stage_compare.py needs only the standard library;
    # the simulation needs numpy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Second implementation against the fixtures
        run: python analysis/stage_compare.py selftest
      - name: Stage simulation, a tenth of the runs
        run: python sim/simulate_stage.py --quick
